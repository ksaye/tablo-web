name: Windows release assets

# WiX only builds real MSIs on Windows (its own tooling says so — "The WiX Toolset only supports
# Windows", and it turns out to mean it: path handling breaks outright on Linux). So this runs on
# windows-latest, not the Linux runners the rest of this org's CI (if any) would default to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach assets to, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/TabloWeb/TabloWeb.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-x64

      - name: Zip the plain exe (no installer needed)
        shell: pwsh
        run: |
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "TabloWeb-win-x64-${{ steps.version.outputs.tag }}.zip"

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the MSI
        # Plain CLI, not an MSBuild project — WixToolset.Sdk 5.0.2 has no working
        # directory-harvest MSBuild integration. `wix build` itself does, via the compiler-level
        # <Files> element in installer/Product.wxs (verified end to end — install, major-upgrade,
        # uninstall — on a real Windows machine, not just compiled).
        # Must run from installer/: Product.wxs's TabloWeb.url <File Source> is a plain relative
        # filename, resolved against the current directory, not the .wxs file's own directory.
        working-directory: installer
        run: >
          wix build Product.wxs -arch x64
          -d Version=${{ steps.version.outputs.version }}
          -d PublishDir=${{ github.workspace }}\publish\win-x64
          -o ..\TabloWeb-win-x64-${{ steps.version.outputs.tag }}.msi

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            TabloWeb-win-x64-${{ steps.version.outputs.tag }}.zip
            TabloWeb-win-x64-${{ steps.version.outputs.tag }}.msi
